name: Publish Pixel Vault to BunnyCDN

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract website ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted

          found_zip=false
          while IFS= read -r -d '' zipfile; do
            found_zip=true
            unzip -oq "$zipfile" -d extracted
          done < <(find . -maxdepth 1 -type f -iname '*.zip' -print0)

          if [ "$found_zip" = false ]; then
            echo "ERROR: No website ZIP found in the repository root."
            exit 1
          fi

          index=$(find extracted -type f -name index.html -print -quit)
          if [ -z "$index" ]; then
            echo "ERROR: Could not find index.html inside the ZIP."
            exit 1
          fi

          site_dir=$(dirname "$index")

          if [ -f "site-source/index.html" ]; then
            cp "site-source/index.html" "$site_dir/index.html"
            echo "Using site-source/index.html as the published entry page."
          fi

          if [ -f "site-source/pv-extra-tabs.js" ]; then
            cp "site-source/pv-extra-tabs.js" "$site_dir/pv-extra-tabs.js"
            python3 - "$site_dir/index.html" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./pv-extra-tabs.js" defer></script>'
          if tag not in s:
              pos = s.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('ERROR: Cannot inject tools script: closing body tag missing.')
              s = s[:pos] + tag + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
          print('Pixel Vault tools script is included.')
          PY
          fi

          echo "SITE_DIR=$site_dir" >> "$GITHUB_ENV"

      - name: Upload website to BunnyCDN
        shell: bash
        env:
          BUNNY_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$BUNNY_KEY" ]; then
            echo "ERROR: Add the BUNNY_STORAGE_PASSWORD repository secret."
            exit 1
          fi

          while IFS= read -r -d '' file; do
            rel="${file#"$SITE_DIR"/}"
            path=$(python3 -c 'import sys,urllib.parse; print("/".join(urllib.parse.quote(p, safe="") for p in sys.argv[1].split("/")))' "$rel")

            curl --fail --silent --show-error \
              --retry 3 \
              -X PUT \
              -H "AccessKey: $BUNNY_KEY" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://ny.storage.bunnycdn.com/pixelvault08/$path"
          done < <(find "$SITE_DIR" -type f -print0)

          echo "Upload finished successfully."

      - name: Purge BunnyCDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
        if: env.BUNNY_API_KEY != '' && env.BUNNY_PULL_ZONE_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            -X POST \
            -H "AccessKey: $BUNNY_API_KEY" \
            "https://api.bunny.net/pullzone/$BUNNY_PULL_ZONE_ID/purgeCache"
          echo "BunnyCDN cache purge requested."

      - name: Verify the live site serves the published homepage
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking the public homepage after upload and cache purge..."
          ok=false
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 \
              "https://pixelvault08.b-cdn.net/?pv_deploy_check=${GITHUB_SHA}-${attempt}" \
              -o /tmp/pv-live-index.html; then
              if grep -q "PIXEL VAULT TOOLS INLINE" /tmp/pv-live-index.html && grep -q "PIXEL VAULT" /tmp/pv-live-index.html; then
                echo "Verified: the public CDN is serving the expected Pixel Vault homepage."
                ok=true
                break
              fi
              echo "Attempt ${attempt}: CDN returned a page without the expected homepage marker."
            else
              echo "Attempt ${attempt}: public CDN request failed."
            fi
            sleep 10
          done
          if [ "$ok" != true ]; then
            echo "::error::Storage upload succeeded, but the public Pull Zone did not serve the expected Pixel Vault homepage after cache purge. The Pull Zone must be linked to Storage Zone pixelvault08 and serve the storage root."
            exit 1
          fi

      - name: Warn if automatic cache purge is not configured
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
        if: env.BUNNY_API_KEY == '' || env.BUNNY_PULL_ZONE_ID == ''
        run: echo "::warning::Upload succeeded, but automatic cache purge is not configured. Add BUNNY_API_KEY and BUNNY_PULL_ZONE_ID repository secrets."
