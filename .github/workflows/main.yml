```yaml
name: Publish Pixel Vault to BunnyCDN

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract website ZIP
        run: |
          set -e
          mkdir -p extracted
          find . -maxdepth 1 -iname '*.zip' -print0 |
            while IFS= read -r -d '' zipfile; do
              unzip -oq "$zipfile" -d extracted
            done

          index=$(find extracted -type f -name index.html -print -quit)
          if [ -z "$index" ]; then
            echo "ERROR: Could not find index.html in the ZIP."
            exit 1
          fi
          echo "SITE_DIR=$(dirname "$index")" >> "$GITHUB_ENV"

      - name: Upload website to BunnyCDN
        env:
          BUNNY_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: |
          set -e
          if [ -z "$BUNNY_KEY" ]; then
            echo "Add the BUNNY_STORAGE_PASSWORD repository secret."
            exit 1
          fi

          while IFS= read -r -d '' file; do
            rel="${file#"$SITE_DIR"/}"
            path=$(python3 -c 'import sys,urllib.parse; print("/".join(urllib.parse.quote(p,safe="") for p in sys.argv[1].split("/")))' "$rel")
            curl --fail --silent --show-error \
              -X PUT \
              -H "AccessKey: $BUNNY_KEY" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://ny.storage.bunnycdn.com/pixelvault08/$path"
          done < <(find "$SITE_DIR" -type f -print0)

          echo "Upload finished."
```
