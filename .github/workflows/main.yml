name: Publish Pixel Vault to BunnyCDN

'on':
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pixel-vault-bunny-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract website ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted

          found_zip=false
          while IFS= read -r -d '' zipfile; do
            found_zip=true
            unzip -oq "$zipfile" -d extracted
          done < <(find . -maxdepth 1 -type f -iname '*.zip' -print0)

          if [ "$found_zip" = false ]; then
            echo "ERROR: No website ZIP found in the repository root."
            exit 1
          fi

          index=$(find extracted -type f -name index.html -print -quit)
          if [ -z "$index" ]; then
            echo "ERROR: Could not find index.html inside the ZIP."
            exit 1
          fi

          site_dir=$(dirname "$index")

          if [ -f "site-source/index.html" ]; then
            cp "site-source/index.html" "$site_dir/index.html"
            echo "Using site-source/index.html as the published entry page."
          fi

          if [ -f "site-source/pv-extra-tabs.js" ]; then
            cp "site-source/pv-extra-tabs.js" "$site_dir/pv-extra-tabs.js"
            python3 - "$site_dir/index.html" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./pv-extra-tabs.js" defer></script>'
          if tag not in s:
              pos = s.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('ERROR: Cannot inject tools script: closing body tag missing.')
              s = s[:pos] + tag + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
          print('Pixel Vault tools script is included.')
          PY
          fi

          if [ -f "site-source/pv-search-fix.js" ]; then
            cp "site-source/pv-search-fix.js" "$site_dir/pv-search-fix.js"
            python3 - "$site_dir/index.html" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./pv-search-fix.js" defer></script>'
          if tag not in s:
              pos = s.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('ERROR: Cannot inject search fix: closing body tag missing.')
              s = s[:pos] + tag + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
          print('Pixel Vault search compatibility fix is included.')
          PY
          fi

          if [ -f "site-source/pv-library-tools.js" ]; then
            cp "site-source/pv-library-tools.js" "$site_dir/pv-library-tools.js"
            python3 - "$site_dir/index.html" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./pv-library-tools.js" defer></script>'
          if tag not in s:
              pos = s.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('ERROR: Cannot inject local library tools: closing body tag missing.')
              s = s[:pos] + tag + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
          print('Pixel Vault local game/movie importing and loader polish are included.')
          PY
          fi

          # Public items are only shared after files have been deliberately committed into these folders.
          mkdir -p "$site_dir/public-games" "$site_dir/public-movies" "site-source/public-game-imports" "site-source/public-movies"
          while IFS= read -r -d '' package; do
            base="$(basename "$package" .zip)"
            slug="$(python3 - "$base" <<'PY'
          import re, sys
          value = re.sub(r'[^a-z0-9]+', '-', sys.argv[1].lower()).strip('-')[:55]
          print(value or 'pixel-vault-game')
          PY
          )"
            target="$site_dir/public-games/$slug"
            mkdir -p "$target"
            python3 - "$package" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          for item in z.infolist():
              name = item.filename.replace("\\", "/")
              if name.startswith("/") or any(part == ".." for part in name.split("/")):
                  raise SystemExit("Unsafe path in public game ZIP: " + item.filename)
          PY
            unzip -oq "$package" -d "$target"
            echo "Prepared public game package: $slug"
          done < <(find "site-source/public-game-imports" -maxdepth 1 -type f -iname '*.zip' -print0)
          while IFS= read -r -d '' movie; do
            rel="$(python3 - "$movie" <<'PY'
          import os, sys
          print(os.path.relpath(sys.argv[1], "site-source/public-movies"))
          PY
          )"
            mkdir -p "$site_dir/public-movies/$(dirname "$rel")"
            cp "$movie" "$site_dir/public-movies/$rel"
          done < <(find "site-source/public-movies" -type f ! -name 'README.md' ! -name '.gitkeep' -print0)
          python3 - "$site_dir" <<'PY'
          import json, pathlib, sys, urllib.parse
          root = pathlib.Path(sys.argv[1]).resolve()
          items = []
          def public_url(path):
              rel = pathlib.Path(path).resolve().relative_to(root).as_posix()
              return "./" + urllib.parse.quote(rel, safe="/-_.~")
          def add_game(folder, manifest=None):
              if manifest:
                  try:
                      meta = json.loads(manifest.read_text(encoding="utf-8"))
                  except Exception as exc:
                      raise SystemExit("Invalid .pv-game.json in " + str(folder) + ": " + str(exc))
                  entry_rel = pathlib.PurePosixPath(str(meta.get("entry", "index.html")).replace("\\", "/"))
                  if entry_rel.is_absolute() or ".." in entry_rel.parts:
                      raise SystemExit("Unsafe game entry path in " + str(manifest))
                  entry = (folder / pathlib.Path(*entry_rel.parts)).resolve()
                  if not entry.is_relative_to(folder.resolve()) or not entry.is_file():
                      raise SystemExit("Game entry file is missing in " + str(folder))
                  items.append({"kind":"game", "name":str(meta.get("name") or folder.name), "url":public_url(entry), "size":entry.stat().st_size})
              else:
                  htmls = sorted(folder.rglob("index.html"))
                  if not htmls:
                      htmls = sorted(p for p in folder.rglob("*") if p.is_file() and p.suffix.lower() in (".html", ".htm"))
                  for entry in htmls:
                      if entry.is_file():
                          name = folder.name if entry.name.lower() == "index.html" else entry.stem
                          items.append({"kind":"game", "name":name, "url":public_url(entry), "size":entry.stat().st_size})
          games_root = root / "public-games"
          if games_root.exists():
              for folder in sorted(games_root.iterdir()):
                  if not folder.is_dir(): continue
                  manifest = folder / ".pv-game.json"
                  if manifest.is_file(): add_game(folder, manifest)
                  else: add_game(folder)
          movies_root = root / "public-movies"
          video_exts = {".mp4", ".webm", ".m4v", ".mov", ".ogv", ".ogg"}
          if movies_root.exists():
              for movie in sorted(movies_root.rglob("*")):
                  if movie.is_file() and movie.suffix.lower() in video_exts:
                      items.append({"kind":"movie", "name":movie.stem, "url":public_url(movie), "size":movie.stat().st_size})
          items.sort(key=lambda x: (x["kind"], x["name"].lower()))
          (root / "public-catalog.json").write_text(json.dumps({"version":1,"items":items}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Generated public catalog with " + str(len(items)) + " public item(s).")
          PY

          echo "SITE_DIR=$site_dir" >> "$GITHUB_ENV"

      - name: Upload website to BunnyCDN
        shell: bash
        env:
          BUNNY_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$BUNNY_KEY" ]; then
            echo "ERROR: Add the BUNNY_STORAGE_PASSWORD repository secret."
            exit 1
          fi

          while IFS= read -r -d '' file; do
            rel="${file#"$SITE_DIR"/}"
            path=$(python3 -c 'import sys,urllib.parse; print("/".join(urllib.parse.quote(p, safe="") for p in sys.argv[1].split("/")))' "$rel")

            curl --fail --silent --show-error \
              --retry 3 \
              -X PUT \
              -H "AccessKey: $BUNNY_KEY" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://ny.storage.bunnycdn.com/pixelvault08/$path"
          done < <(find "$SITE_DIR" -type f -print0)

          echo "Upload finished successfully."

      - name: Purge BunnyCDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
        if: env.BUNNY_API_KEY != '' && env.BUNNY_PULL_ZONE_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            -X POST \
            -H "AccessKey: $BUNNY_API_KEY" \
            "https://api.bunny.net/pullzone/$BUNNY_PULL_ZONE_ID/purgeCache"
          echo "BunnyCDN cache purge requested."

      - name: Verify the live site serves the published homepage
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking the public homepage after upload and cache purge..."
          ok=false
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 \
              "https://pixelvault08.b-cdn.net/?pv_deploy_check=${GITHUB_SHA}-${attempt}" \
              -o /tmp/pv-live-index.html; then
              if grep -q "PIXEL VAULT TOOLS INLINE" /tmp/pv-live-index.html && grep -q "PIXEL VAULT" /tmp/pv-live-index.html && grep -q "pv-search-fix.js" /tmp/pv-live-index.html && grep -q "pv-library-tools.js" /tmp/pv-live-index.html; then
                if curl --fail --silent --show-error --max-time 20 "https://pixelvault08.b-cdn.net/public-catalog.json?verify=1" -o /tmp/pv-live-catalog.json && python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d.get("items"), list)' /tmp/pv-live-catalog.json; then
                  echo "Verified: public catalog JSON is live."
                  echo "Verified: the public CDN serves Pixel Vault with search fixes, local library tools, and a public catalog."
                  ok=true
                  break
                else
                  echo "Attempt $attempt: public catalog JSON is missing or invalid."
                fi
              fi
              echo "Attempt ${attempt}: CDN returned a page without the expected homepage/search-fix marker."
            else
              echo "Attempt ${attempt}: public CDN request failed."
            fi
            sleep 10
          done
          if [ "$ok" != true ]; then
            echo "::error::Storage upload succeeded, but the public Pull Zone did not serve the expected Pixel Vault homepage/search-fix script after cache purge. The Pull Zone must be linked to Storage Zone pixelvault08 and serve the storage root."
            exit 1
          fi

      - name: Warn if automatic cache purge is not configured
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
        if: env.BUNNY_API_KEY == '' || env.BUNNY_PULL_ZONE_ID == ''
        run: echo "::warning::Upload succeeded, but automatic cache purge is not configured. Add BUNNY_API_KEY and BUNNY_PULL_ZONE_ID repository secrets."
